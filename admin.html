    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/my-ads.css">

</head>
<body data-auth="required">


<header class="hd" id="siteHeader"></header>
<script src="js/core/header.js"></script>

<main class="wrap" id="adminMain" hidden>
    <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a> <i class="fa-solid fa-chevron-right"></i>
        <span>Admin</span>
    </nav>

    <div class="page-head">
        <div>
            <h1><i class="fa-solid fa-user-shield"></i> Admin dashboard</h1>
            <p>Review ads before they go live and manage the marketplace.</p>
        </div>
        <button class="btn cancel sm" id="refreshBtn" type="button"><i class="fa-solid fa-rotate"></i> Refresh</button>
    </div>

    <!-- stats -->
    <section class="stats" aria-label="Summary">
        <button class="stat" data-view="all" type="button"><i class="fa-solid fa-rectangle-list"></i><b id="sTotal">–</b><span>Total ads</span></button>
        <button class="stat warn" data-view="pending" type="button"><i class="fa-regular fa-clock"></i><b id="sPending">–</b><span>Pending review</span></button>
        <button class="stat ok" data-view="approved" type="button"><i class="fa-regular fa-circle-check"></i><b id="sApproved">–</b><span>Live ads</span></button>
        <button class="stat sold" data-view="sold" type="button"><i class="fa-solid fa-handshake"></i><b id="sSold">–</b><span>Sold</span></button>
        <button class="stat users" data-view="users" type="button"><i class="fa-solid fa-users"></i><b id="sUsers">–</b><span>Registered users</span></button>
        <button class="stat rep" data-view="reports" type="button"><i class="fa-regular fa-flag"></i><b id="sReports">–</b><span>Open reports</span></button>
    </section>

    <!-- views -->
    <div class="tabs" id="tabs" role="tablist">
        <button class="tab" data-view="all" role="tab">All ads</button>
        <button class="tab on" data-view="pending" role="tab">Pending <span id="cPending">0</span></button>
        <button class="tab" data-view="approved" role="tab">Approved</button>
        <button class="tab" data-view="rejected" role="tab">Rejected</button>
        <button class="tab" data-view="sold" role="tab">Sold</button>
        <button class="tab" data-view="users" role="tab">Users</button>
        <button class="tab" data-view="reports" role="tab">Reports <span class="alert" id="cReports" hidden>0</span></button>
    </div>

    <!-- search + filters (which ones show depends on the tab; see js/pages/admin.js) -->
    <div class="toolbar">
        <label class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="adminSearch" type="search" placeholder="Search ads by title, seller, phone, location…" aria-label="Search" autocomplete="off">
        </label>
        <select id="adminCat" aria-label="Filter by category"><option value="">All categories</option></select>
        <select id="adminUserFilter" aria-label="Filter users" hidden>
            <option value="">All users</option>
            <option value="admin">Admins</option>
            <option value="banned">Banned</option>
            <option value="active">Active (not banned)</option>
        </select>
        <span class="result-count" id="resultCount" aria-live="polite"></span>
    </div>

    <div class="table-wrap" id="tableWrap"></div>
</main>

<div class="deny" id="deny">
    <i class="fa-solid fa-spinner fa-spin"></i>
    <p>Checking access…</p>
</div>

<footer id="siteFooter"></footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="js/pages/admin.js"></script>
<script type="module" src="js/core/session.js"></script>
</body>
</html>
