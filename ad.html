<body>


<header class="hd" id="siteHeader"></header>
<script src="js/core/header.js"></script>

<main class="wrap">

    <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a> <i class="fa-solid fa-chevron-right"></i>
        <a href="category.html?all=1" id="crumbCat">Category</a> <i class="fa-solid fa-chevron-right"></i>
        <span id="crumbTitle">Ad</span>
    </nav>

    <div id="notfound" class="notfound" hidden>
        <i class="fa-solid fa-circle-exclamation"></i>
        <h2>Ad not found</h2>
        <p>This ad may have been removed or the link is incorrect.</p>
        <a href="index.html" class="btn solid">Back to home</a>
    </div>

    <article class="ad" id="ad" hidden>

        <div class="state-banner" id="stateBanner" hidden></div>

        <!-- ============ GALLERY ============ -->
        <section class="gallery">
            <div class="swiper adMain">
                <div class="swiper-wrapper" id="mainSlides"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
                <span class="counter" id="counter"></span>
            </div>
            <div class="swiper adThumbs">
                <div class="swiper-wrapper" id="thumbSlides"></div>
            </div>
        </section>

        <!-- ============ DETAILS ============ -->
        <section class="details">
            <div class="info">
                <div class="tags">
                    <span class="tag" id="condition"></span>
                    <span class="tag ghost" id="negotiable"></span>
                    <div class="tag-actions">
                        <button type="button" class="save-btn" id="saveBtn" data-heart="" hidden><i class="fa-regular fa-heart"></i> <span class="lbl">Save</span></button>
                        <button type="button" class="save-btn share-btn" id="shareBtn"><i class="fa-solid fa-share-nodes"></i> Share</button>
                    </div>
                </div>
                <h1 id="title"></h1>
                <div class="price" id="price"></div>
                <div class="meta">
                    <span><i class="fa-solid fa-location-dot"></i> <b id="location"></b></span>
                    <span><i class="fa-regular fa-clock"></i> <span id="posted"></span></span>
                    <span><i class="fa-solid fa-tag"></i> <span id="category"></span></span>
                </div>

                <h2>Description</h2>
                <p class="desc" id="description"></p>
            </div>

            <aside class="seller">
                <div class="seller-head">
                    <div class="avatar" id="avatar"></div>
                    <div>
                        <small>Sold by</small>
                        <h3 id="sellerName"></h3>
                    </div>
                </div>
                <!-- verified badge + Follow button (only for sellers an admin has verified; see js/features/follow.js) -->
                <div class="follow-box" id="followBox" hidden></div>

                <a class="wa-btn" id="waBtn" target="_blank" rel="noopener">
                    <i class="fab fa-whatsapp"></i> Contact via WhatsApp
                </a>

                <button type="button" class="report-btn" id="reportBtn" hidden><i class="fa-regular fa-flag"></i> Report this ad</button>

                <div class="safety">
                    <b><i class="fa-solid fa-shield-halved"></i> Safety tips</b>
                    <ul>
                        <li>Meet in a public place</li>
                        <li>Inspect the item before paying</li>
                        <li>Never pay in advance</li>
                    </ul>
                </div>
            </aside>
        </section>
    </article>
</main>

<!-- sticky contact bar for phones -->
<div class="mobile-cta" id="mobileCta" hidden>
    <b id="ctaPrice"></b>
    <a class="wa-btn" id="waBtn2" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> WhatsApp</a>
</div>

<footer id="siteFooter"></footer>
