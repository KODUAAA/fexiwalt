<body>


<header class="hd" id="siteHeader"></header>
<script src="js/core/header.js"></script>

<main class="wrap auth-main">
    <aside class="auth-photo" data-photo="images/auth.jpg">
        <div><h2>Buy and sell across Ghana</h2><p>Join FEXIWALT and reach thousands of buyers near you.</p></div>
    </aside>
    <div class="auth-card">
        <div class="auth-logo"><img src="images/logo.jpg" alt=""></div>
        <h1>Welcome back</h1>
        <p class="sub">Log in to post ads, save favourites and chat with sellers.</p>

        <button type="button" class="google-btn" id="googleBtn"><svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span>Continue with Google</span></button>
        <div class="or"><span>or use your email</span></div>

        <form id="authForm" data-mode="login" novalidate>
            <div class="field">
                <label for="email">Email address</label>
                <div class="prefix"><em><i class="fa-regular fa-envelope"></i></em>
                    <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
                </div>
                <div class="hint"><span class="err" data-for="email"></span></div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="prefix"><em><i class="fa-solid fa-lock"></i></em>
                    <input id="password" name="password" type="password" required minlength="8" autocomplete="current-password" placeholder="Your password">
                    <button type="button" class="eye" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                </div>
                <div class="hint"><span class="err" data-for="password"></span></div>
            </div>

            <div class="row-between">
                <label class="check"><input type="checkbox" name="remember"> Remember me</label>
                <a href="forgot-password.html" class="link" id="forgotLink">Forgot password?</a>
            </div>

            <div class="form-msg" id="formMsg" role="status" hidden></div>
            <button type="submit" class="btn solid submit">Log In</button>
        </form>

        <p class="switch">New to FEXIWALT? <a href="register.html">Create an account</a></p>
    </div>
</main>

<footer id="siteFooter"></footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
