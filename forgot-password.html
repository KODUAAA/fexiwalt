<body>


<header class="hd" id="siteHeader"></header>
<script src="js/core/header.js"></script>

<main class="wrap auth-main">
    <div class="auth-card">
        <div class="auth-logo"><img src="images/logo.jpg" alt=""></div>

        <!-- step 1: ask for the email -->
        <div id="askPanel">
            <h1>Forgot your password?</h1>
            <p class="sub">Enter the email you signed up with and we'll send you a link to choose a new password.</p>

            <form id="forgotForm" novalidate>
                <div class="field">
                    <label for="email">Email address</label>
                    <div class="prefix"><em><i class="fa-regular fa-envelope"></i></em>
                        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
                    </div>
                    <div class="hint"><span class="err" data-for="email"></span></div>
                </div>
                <button type="submit" class="btn solid submit">Send reset link</button>
            </form>
        </div>

        <!-- step 2: confirmation -->
        <div id="sentPanel" hidden>
            <div class="sent-ico"><i class="fa-regular fa-envelope-open"></i></div>
            <h1>Check your email</h1>
            <p class="sub" id="sentText"></p>
            <ul class="sent-tips">
                <li>The email can take a few minutes to arrive.</li>
                <li>Look in your <b>Spam</b> or <b>Junk</b> folder too.</li>
                <li>The link works for a limited time.</li>
            </ul>
            <button type="button" class="btn cancel submit" id="againBtn">Use a different email</button>
        </div>

        <p class="switch">Remembered it? <a href="login.html">Back to log in</a></p>
    </div>
</main>

<footer id="siteFooter"></footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
