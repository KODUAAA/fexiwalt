<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're offline - FEXIWALT</title>
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#0a3fc4">
    <!-- Shown by the service worker (sw.js) when a page can't be loaded because there's no internet.
         Everything is inline on purpose: this page must work with no network at all. -->
    <style>
        *{box-sizing:border-box;margin:0}
        body{min-height:100vh;display:grid;place-items:center;padding:1.5rem;font-family:"Nunito Sans","Segoe UI",Arial,sans-serif;background:#f6f8fc;color:#3b4763;text-align:center}
        .card{max-width:420px;background:#fff;border:1px solid #e5eaf3;border-radius:16px;padding:2.4rem 1.6rem;box-shadow:0 2px 10px rgba(15,27,61,.07)}
        img{width:84px;height:84px;object-fit:contain;margin:0 auto 1rem;display:block}
        h1{font-size:1.4rem;color:#0f1b3d;margin-bottom:.5rem}
        p{line-height:1.6;margin-bottom:1.4rem}
        button{border:0;background:#0b57e6;color:#fff;font:inherit;font-weight:600;padding:.8rem 1.8rem;border-radius:99px;cursor:pointer}
        button:hover{background:#0a3fc4}
        @media (prefers-color-scheme: dark){
            body{background:#0b1220;color:#b8c3d9}
            .card{background:#121b2e;border-color:#243250}
            h1{color:#e8edf7}
            img{background:#fff;border-radius:50%;padding:4px}
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/logo.jpg" alt="">
        <h1>You're offline</h1>
        <p>We can't reach FEXIWALT right now. Check your internet connection or mobile data, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
