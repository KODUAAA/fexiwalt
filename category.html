<body>


<header class="hd" id="siteHeader"></header>
<script src="js/core/header.js"></script>

<main class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a> <i class="fa-solid fa-chevron-right"></i>
        <span id="crumb">All ads</span>
    </nav>

    <div class="page-head">
        <div>
            <h1 id="heading">All ads</h1>
            <p id="resultCount">Loading…</p>
        </div>
        <label class="sort">Sort by
            <select id="sort">
                <option value="new">Newest first</option>
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
                <option value="discount">Biggest discount</option>
            </select>
        </label>
    </div>

    <div class="cat-layout">
        <aside class="filters" id="filters">
            <form id="filterForm">
                <h3>Filters <button type="button" class="clear" id="clearBtn">Clear all</button></h3>

                <div class="f">
                    <label for="q">Search</label>
                    <input id="q" name="q" type="search" placeholder="Keywords">
                </div>

                <div class="f">
                    <label for="cat">Category</label>
                    <select id="cat" name="cat">
                        <option value="">All categories</option>
                        <option>Electronics</option>
                        <option>Mobile Phones &amp; Tablets</option>
                        <option>Vehicles</option>
                        <option>Property</option>
                        <option>Fashion</option>
                        <option>Home &amp; Furniture</option>
                        <option>Health &amp; Beauty</option>
                        <option>Jobs</option>
                        <option>Services</option>
                        <option>Others</option>
                    </select>
                </div>

                <div class="f">
                    <label>Price (GH₵)</label>
                    <div class="pair">
                        <input name="min" type="number" min="0" placeholder="Min" aria-label="Minimum price">
                        <input name="max" type="number" min="0" placeholder="Max" aria-label="Maximum price">
                    </div>
                </div>

                <div class="f">
                    <label for="region">Region</label>
                    <select id="region" name="region">
                        <option value="">All regions</option>
                        <!-- filled in by js/pages/category.js from js/core/locations.js -->
                    </select>
                </div>

                <div class="f">
                    <label for="loc">Area / town</label>
                    <input id="loc" name="loc" type="text" list="filterAreas" autocomplete="off" placeholder="e.g. East Legon">
                    <datalist id="filterAreas"></datalist>
                </div>

                <div class="f">
                    <label>Condition</label>
                    <div class="chips">
                        <label><input type="radio" name="cond" value="" checked><span>Any</span></label>
                        <label><input type="radio" name="cond" value="New"><span>New</span></label>
                        <label><input type="radio" name="cond" value="Used"><span>Used</span></label>
                    </div>
                </div>

                <label class="check dealcheck"><input type="checkbox" name="deals" value="1"> On sale (deals) only</label>

                <button type="submit" class="btn solid apply">Apply filters</button>
            </form>
        </aside>

        <section>
            <button type="button" class="btn cancel filter-toggle" id="filterToggle"><i class="fa-solid fa-sliders"></i> Filters</button>
            <div class="active-filters" id="activeFilters" hidden aria-label="Active filters"></div>
            <div class="ads-grid results" id="results"></div>
        </section>
    </div>
</main>

<footer id="siteFooter"></footer>

<script type="module" src="js/pages/category.js"></script>
<script type="module" src="js/core/session.js"></script>
</body>
</html>
